[package]
name = "coachbuddy-mcp-rust"
version = "0.1.0"
edition = "2021"
authors = ["CoachBuddy Architecture Team"]
description = "Deterministic Timeline Math Verification, MongoDB History & SVG QR Code MCP Server"

[dependencies]
axum = "0.8"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qrcode = "0.15"
mongodb = { version = "2.8", default-features = false, features = ["tokio-runtime"] }
futures-util = "0.3"
# Official MCP SDK: protocol, version negotiation and the Streamable HTTP transport (axum 0.8).
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-streamable-http-server"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
