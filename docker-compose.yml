services:
  postgres:
    image: postgres:16-alpine
    container_name: coachbuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coachbuddy
      POSTGRES_PASSWORD: coachbuddy_secret
      POSTGRES_DB: coachbuddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coachbuddy -d coachbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: coachbuddy-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coachbuddy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-rust:
    build:
      context: ./services/mcp-rust
      dockerfile: Dockerfile
    container_name: coachbuddy-mcp-rust
    restart: unless-stopped
    environment:
      RUST_LOG: info
      PORT: 8082
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: coachbuddy
    ports:
      - "${MCP_RUST_PORT:-8085}:8082"
    depends_on:
      mongodb:
        condition: service_healthy

  agents-python:
    build:
      context: ./services/agents-python
      dockerfile: Dockerfile
    container_name: coachbuddy-agents-python
    restart: unless-stopped
    environment:
      PORT: 8081
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: coachbuddy
      REDIS_URL: redis://redis:6379/0
      MCP_RUST_URL: http://mcp-rust:8082
      DEFAULT_GEMINI_API_KEY: ${DEFAULT_GEMINI_API_KEY:-}
      DEFAULT_OPENAI_API_KEY: ${DEFAULT_OPENAI_API_KEY:-}
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-rust:
        condition: service_started

  gateway-go:
    build:
      context: ./services/gateway-go
      dockerfile: Dockerfile
    container_name: coachbuddy-gateway-go
    restart: unless-stopped
    environment:
      GATEWAY_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-coachbuddy-super-secret-jwt-signing-key-2026}
      MASTER_ENCRYPTION_KEY_HEX: ${MASTER_ENCRYPTION_KEY_HEX:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      POSTGRES_DSN: postgres://coachbuddy:coachbuddy_secret@postgres:5432/coachbuddy?sslmode=disable
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: coachbuddy
      REDIS_URL: redis://redis:6379/0
      AGENTS_SERVICE_URL: http://agents-python:8081
      MCP_RUST_URL: http://mcp-rust:8082
      PUBLIC_SHARE_BASE_URL: http://localhost:3000/s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      agents-python:
        condition: service_started

  pwa-nextjs:
    build:
      context: ./web/pwa-nextjs
      dockerfile: Dockerfile
    container_name: coachbuddy-pwa-nextjs
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      INTERNAL_GATEWAY_URL: http://gateway-go:8080
    ports:
      - "3000:3000"
    depends_on:
      - gateway-go

volumes:
  pgdata:
  mongodata:
  redisdata:
