# Checks for every pull request and every push to main.
# "schema (contract)" fails when schema/ changed but the generated types were not regenerated.
# Phase 6 adds path filters, image builds and deployment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-go:
    name: gateway-go (Go)
    runs-on: ubuntu-latest
    # Real databases for internal/store/integration_test.go. Throwaway
    # credentials, only reachable from this job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: coachbuddy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d coachbuddy"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GATEWAY_TEST_POSTGRES_DSN: postgres://ci:ci@localhost:5432/coachbuddy?sslmode=disable
      GATEWAY_TEST_MONGO_URI: mongodb://localhost:27017
      GATEWAY_TEST_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: services/gateway-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/gateway-go/go.mod
          cache-dependency-path: services/gateway-go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  agents-python:
    name: agents-python (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agents-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/agents-python/requirements.txt
            services/agents-python/requirements-dev.txt
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  mcp-rust:
    name: mcp-rust (Rust)
    runs-on: ubuntu-latest
    # Real MongoDB for the history tests in src/tests.rs.
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MCP_TEST_MONGO_URI: mongodb://localhost:27017
    defaults:
      run:
        working-directory: services/mcp-rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.97
        run: |
          rustup toolchain install 1.97 --profile minimal --component rustfmt
          rustup default 1.97
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/mcp-rust
      - run: cargo fmt --check
      - run: cargo test --locked

  pwa-nextjs:
    name: pwa-nextjs (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/pwa-nextjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/pwa-nextjs/package-lock.json
      - run: npm ci
      - run: npm run build

  schema:
    name: schema (contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: schema/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: schema/requirements-gen.txt
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/gateway-go/go.mod
          cache-dependency-path: services/gateway-go/go.sum
      - name: Install Rust 1.97
        run: |
          rustup toolchain install 1.97 --profile minimal --component rustfmt
          rustup default 1.97
      - name: Cache cargo-typify
        id: typify-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-typify
          key: cargo-typify-0.10.1-rust-1.97-${{ runner.os }}
      - name: Install cargo-typify
        if: steps.typify-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-typify --version 0.10.1 --locked
      - name: Install schema tools
        run: |
          npm ci --prefix schema
          pip install -r schema/requirements-gen.txt
      - name: Examples match their schemas
        run: npm test --prefix schema
      - name: Generated types match the schema
        run: |
          scripts/gen-schema
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated contract types are out of date. Run scripts/gen-schema and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  compose:
    name: compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose.yml with compose.dev.yml
        run: |
          for k in JWT_SECRET MASTER_ENCRYPTION_KEY_HEX INTERNAL_GATEWAY_TOKEN POSTGRES_PASSWORD MONGO_PASSWORD REDIS_PASSWORD; do
            echo "$k=ci-placeholder" >> ci.env
          done
          docker compose --env-file ci.env -f compose.yml -f compose.dev.yml config --quiet

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1
          git . --config .gitleaks.toml --redact --no-banner
