# Weekly version updates, one grouped pull request per ecosystem.
# Security updates are separate and arrive when an advisory is published.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /services/gateway-go
    schedule: { interval: weekly, day: monday }
    groups:
      go: { patterns: ["*"] }

  # requirements.txt is a hashed lock compiled from requirements.in (see the file header).
  - package-ecosystem: pip
    directory: /services/agents-python
    schedule: { interval: weekly, day: monday }
    groups:
      python: { patterns: ["*"] }
    ignore:
      # google-adk, litellm and mcp move together, by hand, after reading
      # ADK's release notes (root AGENTS.md section 4). Grouped bumps of them
      # also broke the hashed lock (#28, #31: fastuuid left unpinned).
      - dependency-name: google-adk
      - dependency-name: litellm
      - dependency-name: mcp

  - package-ecosystem: cargo
    directory: /services/mcp-rust
    schedule: { interval: weekly, day: monday }
    groups:
      rust: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /web/pwa-nextjs
    schedule: { interval: weekly, day: monday }
    groups:
      npm: { patterns: ["*"] }
    ignore:
      # Next.js and React majors are planned work, done by hand (Next 16 and
      # React 19 in Phase 3). The React types move with React.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Tooling majors change the build (TypeScript 7 had no JS API for Next 14,
      # Tailwind 4 moves its PostCSS plugin), so they are planned work too.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: lucide-react
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /services/gateway-go
      - /services/agents-python
      - /services/mcp-rust
      - /web/pwa-nextjs
    schedule: { interval: weekly, day: monday }
    groups:
      docker: { patterns: ["*"] }
    ignore:
      # Language runtimes move on purpose, together with the CI pin and the lock file.
      # For these images a release line is a minor bump (python 3.12 -> 3.15), so minor is ignored too.
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: rust
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      compose: { patterns: ["*"] }
    ignore:
      # A database major version needs a data migration, so it is never automatic.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: mongo
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
